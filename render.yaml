services:
  - type: web
    name: ray-ryn-trading-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: EXCHANGE_API_KEY
        sync: false
      - key: EXCHANGE_API_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: TRADING_MODE
        value: testnet
      - key: POLL_SECONDS
        value: "2"
      - key: TRADING_PAIR
        value: BTC/USDT
      - key: DROP_BUY_PERCENT
        value: "0.4"
      - key: RISE_SELL_PERCENT
        value: "0.4"
      - key: TRADE_ORDER_USDT
        value: "10.0"
      # للحفظ الدائم: أضف Disk على Render (خطة مدفوعة) واجعل المسار /data
      # - key: MEMORY_FILE_PATH
      #   value: /data/ryn_memory.json
