services:
  - type: web
    name: ray-ryn-trading-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: EXCHANGE_API_KEY
        sync: false
      - key: EXCHANGE_API_SECRET
        sync: false
      - key: TRADING_MODE
        value: testnet
      - key: DROP_BUY_PERCENT
        value: "2.0"
      - key: RISE_SELL_PERCENT
        value: "2.0"
      - key: TRADE_ORDER_USDT
        value: "50.0"
